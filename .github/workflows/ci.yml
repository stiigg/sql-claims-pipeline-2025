name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint YAML
        run: |
          python - <<'PY'
import yaml,glob,sys
for p in glob.glob('config/*.yaml'):
    with open(p) as f: yaml.safe_load(f)
print('YAML OK')
PY
      - name: Record template manifest (no prior baseline in CI)
        run: |
          python tools/template_manifest.py
