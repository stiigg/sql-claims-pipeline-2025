version: 1.0.0
window: {start: 2024-01-01, end: 2024-12-31}

metrics:
  hypertension:
    type: condition_rate_per_1000
    denom: enrolled_members_18_plus
    lookback_days: 365
    age: {min: 18, max: 120}
    sex: [F, M, U]
    icd10_include: ["I10%", "I11%", "I12%", "I13%"]

  diabetes:
    type: condition_rate_per_1000
    denom: enrolled_members_18_plus
    lookback_days: 365
    icd10_include: ["E10%", "E11%"]
    exclusions: {gestational: ["O24%"]}

  low_back_pain:
    type: condition_rate_per_1000
    denom: enrolled_members_18_plus
    lookback_days: 365
    icd10_include: ["M54%"]

  breast_cancer_screening:
    type: screening_rate
    denom: eligible_female_50_74
    lookback_days: 730
    cpt_include: [77067, 77066, 77065]

  cervical_cancer_screening:
    type: screening_rate
    denom: eligible_female_21_64
    lookback_days: 1095
    cpt_include: [88175, 87624]

  colon_cancer_screening:
    type: screening_rate
    denom: eligible_45_75
    lookback_days: 3650
    cpt_include: [45378, 82274, 81528]

  er_visit_rate:
    type: utilization_per_1000
    where: "encounter_type = 'ER'"

  avoidable_er_rate:
    type: utilization_per_1000
    proxy: "dx_group IN ('nonemergent','primary_care_treatable')"

  inpatient_admission_rate:
    type: utilization_per_1000
    where: "encounter_type = 'INPATIENT'"

  readmission_rate_30d:
    type: readmission_30d

  avoidable_admission_rate:
    type: utilization_per_1000
    proxy: "prevention_quality_indicator = 1"

  complication_rate:
    type: event_rate
    where: "complication_flag = 1"

demographics:
  include: [avg_age, pct_female, pct_male, total_members]
